<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Schedule</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" href="icons/atlas-favicon.png">
<link rel="apple-touch-icon" href="icons/atlas-192.png">
<meta name="theme-color" content="#0f0f14">
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    /* Restrained dark palette — warm-charcoal neutrals + one violet accent */
    --bg:        #0f0f14;
    --surface:   #16161d;
    --surface-2: #1d1d26;
    --surface-3: #24242f;
    --border:    rgba(255,255,255,0.07);
    --border-2:  rgba(255,255,255,0.13);
    --ink:       #ececf0;
    --muted:     #9a9aa6;
    --faint:     #6b6b78;
    --accent:    #8b7cf6;
    --accent-ink:#b3a8ff;
    --accent-soft: rgba(139,124,246,0.14);
    --accent-line: rgba(139,124,246,0.40);
    --hi:  #f0736b;   /* high priority  */
    --med: #e0a33a;   /* med priority   */
    --lo:  #74748a;   /* low priority   */
    --green: #4ec98c;
    --red:   #f0736b;
    --ease: cubic-bezier(0.22, 1, 0.36, 1);   /* ease-out-quint */
    --r: 10px;
    --font: 'Inter Tight', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  }
  html, body { height: 100%; }
  body {
    background:
      radial-gradient(900px 420px at 78% -8%, rgba(139,124,246,0.10), transparent 70%),
      var(--bg);
    background-attachment: fixed;
    color: var(--ink);
    font-family: var(--font);
    font-size: 14px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
  }
  ::selection { background: var(--accent-soft); }
  ::-webkit-scrollbar { width: 9px; height: 9px; }
  ::-webkit-scrollbar-thumb { background: var(--surface-3); border-radius: 6px; border: 2px solid transparent; background-clip: padding-box; }
  ::-webkit-scrollbar-thumb:hover { background: #33333f; background-clip: padding-box; }
  button { font-family: inherit; }

  .wrap { max-width: 760px; margin: 0 auto; padding: 40px 22px 96px; }

  /* ── Header ── */
  header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 26px; gap: 14px; }
  .title { font-size: 21px; font-weight: 700; letter-spacing: -0.02em; color: var(--ink); display: flex; align-items: center; gap: 9px; }
  .title .mark { width: 9px; height: 9px; border-radius: 3px; background: var(--accent); box-shadow: 0 0 12px var(--accent-line); }
  .title .sub { font-size: 12px; font-weight: 500; color: var(--faint); letter-spacing: 0; }
  .header-actions { display: flex; gap: 8px; align-items: center; }
  .ghost-btn, .back {
    font-size: 12.5px; font-weight: 500; color: var(--muted); text-decoration: none;
    padding: 7px 12px; border: 1px solid var(--border); border-radius: 8px; background: var(--surface);
    cursor: pointer; transition: color .16s var(--ease), border-color .16s var(--ease), background .16s var(--ease);
  }
  .ghost-btn:hover, .back:hover { color: var(--ink); border-color: var(--border-2); background: var(--surface-2); }

  /* ── Sync row ── */
  .sync-bar {
    display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
    padding: 9px 13px; margin-bottom: 16px;
    background: var(--surface); border: 1px solid var(--border); border-radius: var(--r);
    font-size: 12.5px; color: var(--muted);
  }
  .sync-dot { width: 7px; height: 7px; border-radius: 999px; background: var(--faint); flex-shrink: 0; transition: background .3s; }
  .sync-dot.on { background: var(--green); box-shadow: 0 0 8px rgba(78,201,140,0.6); }
  .sync-btn { margin-left: auto; }
  .sync-form { display: flex; gap: 6px; flex-wrap: wrap; margin-left: auto; align-items: center; }
  .sync-form[hidden] { display: none; }
  .sync-form input {
    background: var(--bg); border: 1px solid var(--border); color: var(--ink);
    padding: 7px 10px; border-radius: 8px; font-size: 12.5px; outline: none; width: 160px; font-family: inherit;
    transition: border-color .16s var(--ease);
  }
  .sync-form input:focus { border-color: var(--accent-line); }
  .sync-form button { padding: 7px 13px; border-radius: 8px; font-size: 12.5px; font-weight: 600; cursor: pointer; border: 1px solid var(--accent-line); background: var(--accent-soft); color: var(--accent-ink); }
  .sync-form button#sync-cancel { background: var(--surface); border-color: var(--border); color: var(--muted); }

  /* ── Composer (add form) ── */
  .composer {
    background: var(--surface); border: 1px solid var(--border); border-radius: 14px;
    padding: 6px 6px 12px; margin-bottom: 18px;
  }
  .composer-main { display: flex; gap: 6px; align-items: center; }
  #task-input {
    flex: 1; background: transparent; border: none; color: var(--ink);
    padding: 13px 12px; font-size: 15px; outline: none; font-family: inherit;
  }
  #task-input::placeholder { color: var(--faint); }
  .add-btn {
    flex-shrink: 0; width: 38px; height: 38px; border-radius: 9px; cursor: pointer;
    border: 1px solid var(--accent-line); background: var(--accent); color: #fff;
    font-size: 20px; line-height: 1; display: grid; place-items: center;
    transition: filter .16s var(--ease), transform .12s var(--ease);
  }
  .add-btn:hover { filter: brightness(1.1); }
  .add-btn:active { transform: scale(0.92); }
  .composer-opts { display: flex; flex-wrap: wrap; align-items: center; gap: 7px 14px; padding: 4px 8px 0; }
  .opt-row { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
  .opt-label { font-size: 12px; color: var(--faint); font-weight: 500; margin-right: 2px; }
  .chip {
    position: relative;
    background: var(--surface-2); border: 1px solid transparent; color: var(--muted);
    padding: 5px 11px; border-radius: 8px; font-size: 12.5px; font-weight: 500; cursor: pointer;
    font-family: inherit; transition: color .16s var(--ease), background .16s var(--ease), border-color .16s var(--ease);
    display: inline-flex; align-items: center; gap: 6px;
  }
  .chip:hover { color: var(--ink); background: var(--surface-3); }
  .chip.active { color: #fff; background: var(--accent-soft); border-color: var(--accent-line); }
  .chip .pdot { width: 8px; height: 8px; border-radius: 999px; }
  .chip[data-prio="low"] .pdot { background: var(--lo); }
  .chip[data-prio="med"] .pdot { background: var(--med); }
  .chip[data-prio="high"] .pdot { background: var(--hi); }

  /* ── Filter tabs (carry the counts; no separate stats hero) ── */
  .tabs { display: flex; gap: 4px; margin-bottom: 14px; flex-wrap: wrap; border-bottom: 1px solid var(--border); padding-bottom: 0; }
  .tab {
    background: transparent; border: none; border-bottom: 2px solid transparent; color: var(--muted);
    padding: 8px 12px 10px; font-size: 13px; font-weight: 500; cursor: pointer; font-family: inherit;
    display: inline-flex; align-items: center; gap: 7px; margin-bottom: -1px;
    transition: color .16s var(--ease), border-color .16s var(--ease);
  }
  .tab:hover { color: var(--ink); }
  .tab.active { color: var(--ink); border-bottom-color: var(--accent); }
  .tab .count {
    font-size: 11px; font-weight: 600; color: var(--faint);
    background: var(--surface-2); padding: 1px 7px; border-radius: 999px; min-width: 20px; text-align: center;
  }
  .tab.active .count { color: var(--accent-ink); background: var(--accent-soft); }
  .tab.overdue { color: var(--red); }
  .tab.overdue .count { color: var(--red); background: rgba(240,115,107,0.13); }

  /* ── Task list ── */
  .tasks { display: flex; flex-direction: column; gap: 2px; }
  .task {
    display: grid; grid-template-columns: auto auto 1fr auto auto; gap: 11px; align-items: center;
    padding: 11px 12px; border-radius: var(--r);
    background: transparent; border: 1px solid transparent;
    transition: background .16s var(--ease), border-color .16s var(--ease);
    will-change: transform;
  }
  .task:hover { background: var(--surface); border-color: var(--border); }
  .task.done { opacity: 0.5; }
  .task.done .task-text { text-decoration: line-through; text-decoration-color: var(--faint); color: var(--muted); }

  .task-check {
    appearance: none; -webkit-appearance: none; width: 18px; height: 18px; flex-shrink: 0;
    border: 1.5px solid var(--border-2); border-radius: 6px; background: transparent; cursor: pointer;
    position: relative; transition: border-color .16s var(--ease), background .16s var(--ease);
  }
  .task-check:hover { border-color: var(--accent); }
  .task-check:checked { background: var(--accent); border-color: var(--accent); }
  .task-check:checked::after {
    content: ''; position: absolute; left: 5px; top: 1.5px; width: 5px; height: 9px;
    border: solid #fff; border-width: 0 2px 2px 0; transform: rotate(45deg);
  }
  .task-check:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  .pdot { width: 7px; height: 7px; border-radius: 999px; flex-shrink: 0; }
  .pdot.low { background: var(--lo); }
  .pdot.med { background: var(--med); }
  .pdot.high { background: var(--hi); }

  .task-text { font-size: 14.5px; color: var(--ink); word-break: break-word; min-width: 0; cursor: text; }
  .task-text[contenteditable="true"] { outline: none; background: var(--surface-2); padding: 2px 5px; border-radius: 5px; box-shadow: 0 0 0 1px var(--accent-line); }

  .due {
    font-size: 12px; font-weight: 500; color: var(--muted); white-space: nowrap;
    padding: 3px 9px; border-radius: 7px; background: var(--surface-2);
  }
  .due.today { color: var(--accent-ink); background: var(--accent-soft); }
  .due.tomorrow { color: var(--ink); }
  .due.overdue { color: var(--red); background: rgba(240,115,107,0.12); }

  .task-actions { display: flex; gap: 2px; opacity: 0; transition: opacity .16s var(--ease); }
  .task:hover .task-actions, .task:focus-within .task-actions { opacity: 1; }
  .icon-btn {
    width: 28px; height: 28px; border-radius: 7px; border: none; background: transparent; color: var(--faint);
    cursor: pointer; display: grid; place-items: center; font-size: 15px; transition: color .14s, background .14s;
  }
  .icon-btn:hover { color: var(--ink); background: var(--surface-2); }
  .icon-btn.del:hover { color: var(--red); background: rgba(240,115,107,0.12); }

  /* ── Empty state ── */
  .empty { text-align: center; padding: 56px 20px; color: var(--faint); }
  .empty .glyph { font-size: 30px; opacity: 0.5; margin-bottom: 12px; }
  .empty .line { font-size: 14px; color: var(--muted); }
  .empty .hint { font-size: 12.5px; color: var(--faint); margin-top: 5px; }

  /* ── Footer controls ── */
  .controls { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-top: 26px; padding-top: 18px; border-top: 1px solid var(--border); }
  .controls .ghost-btn { background: transparent; }
  #remind-btn.on { color: var(--green); border-color: rgba(78,201,140,0.4); }
  #data-msg { font-size: 12px; color: var(--muted); margin-left: 4px; }
  #data-msg.ok { color: var(--green); }
  #data-msg.err { color: var(--red); }
  footer { margin-top: 30px; text-align: center; font-size: 11.5px; color: var(--faint); }

  /* ── Popover (date + time pickers) ── */
  .pop {
    position: absolute; z-index: 60; margin-top: 8px;
    background: var(--surface); border: 1px solid var(--border-2); border-radius: 12px;
    box-shadow: 0 16px 40px rgba(0,0,0,0.5); padding: 12px;
    animation: popIn .16s var(--ease);
  }
  .pop[hidden] { display: none; }
  @keyframes popIn { from { opacity: 0; transform: translateY(-4px); } to { opacity: 1; transform: translateY(0); } }

  /* calendar */
  .cal-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
  .cal-title { font-size: 13.5px; font-weight: 600; color: var(--ink); }
  .cal-nav { display: flex; gap: 2px; }
  .cal-nav button { width: 28px; height: 28px; border-radius: 7px; border: none; background: transparent; color: var(--muted); cursor: pointer; font-size: 15px; transition: background .14s, color .14s; }
  .cal-nav button:hover { background: var(--surface-2); color: var(--ink); }
  .cal-grid { display: grid; grid-template-columns: repeat(7, 32px); gap: 2px; }
  .cal-dow { font-size: 10.5px; font-weight: 600; color: var(--faint); text-align: center; padding: 4px 0; }
  .cal-day {
    height: 30px; border-radius: 7px; border: none; background: transparent; color: var(--ink);
    font-size: 12.5px; font-family: inherit; cursor: pointer; transition: background .12s var(--ease), color .12s;
  }
  .cal-day:hover { background: var(--surface-2); }
  .cal-day.out { color: var(--faint); opacity: 0.55; }
  .cal-day.today { box-shadow: inset 0 0 0 1px var(--accent-line); color: var(--accent-ink); }
  .cal-day.sel { background: var(--accent); color: #fff; }
  .cal-foot { display: flex; justify-content: space-between; margin-top: 10px; padding-top: 9px; border-top: 1px solid var(--border); }
  .cal-foot button { background: transparent; border: none; color: var(--muted); font-size: 12px; font-weight: 500; cursor: pointer; font-family: inherit; padding: 3px 6px; border-radius: 6px; }
  .cal-foot button:hover { color: var(--ink); background: var(--surface-2); }

  /* time picker */
  .time-pop { width: 184px; max-height: 232px; overflow-y: auto; }
  .time-opt { display: block; width: 100%; text-align: left; padding: 7px 10px; border-radius: 7px; border: none; background: transparent; color: var(--ink); font-size: 13px; font-family: inherit; cursor: pointer; transition: background .12s; }
  .time-opt:hover { background: var(--surface-2); }
  .time-opt.sel { background: var(--accent-soft); color: var(--accent-ink); }

  /* ── Tour ── */
  .tour { position: fixed; inset: 0; z-index: 200; }
  .tour[hidden] { display: none; }
  .tour-hl {
    position: fixed; border-radius: 10px; box-shadow: 0 0 0 9999px rgba(6,6,10,0.78);
    border: 1.5px solid var(--accent); pointer-events: none; opacity: 0;
    transition: top .4s var(--ease), left .4s var(--ease), width .4s var(--ease), height .4s var(--ease), opacity .3s;
  }
  .tour-tip {
    position: fixed; z-index: 201; width: min(330px, calc(100vw - 32px));
    background: var(--surface); border: 1px solid var(--border-2); border-radius: 13px;
    padding: 17px 17px 13px; box-shadow: 0 20px 48px rgba(0,0,0,0.55);
    transition: top .35s var(--ease), left .35s var(--ease);
  }
  .tour-n { font-size: 11.5px; color: var(--accent-ink); font-weight: 600; margin-bottom: 6px; }
  .tour-h { font-size: 16px; font-weight: 700; margin-bottom: 6px; }
  .tour-t { font-size: 13px; line-height: 1.55; color: var(--muted); margin-bottom: 15px; }
  .tour-nav { display: flex; align-items: center; gap: 8px; }
  .tour-dots { display: flex; gap: 5px; flex: 1; justify-content: center; }
  .tour-dots span { width: 6px; height: 6px; border-radius: 999px; background: var(--surface-3); transition: background .3s, transform .3s; }
  .tour-dots span.on { background: var(--accent); transform: scale(1.3); }
  .tour-nav button { font-size: 12.5px; font-weight: 600; cursor: pointer; padding: 7px 13px; border-radius: 8px; border: 1px solid var(--border); background: var(--surface-2); color: var(--muted); transition: color .14s, border-color .14s, background .14s; }
  .tour-nav button:hover { color: var(--ink); border-color: var(--border-2); }
  .tour-nav button.primary { background: var(--accent); border-color: var(--accent-line); color: #fff; }

  @media (max-width: 560px) {
    .wrap { padding: 28px 16px 70px; }
    .cal-grid { grid-template-columns: repeat(7, 1fr); }
  }
  @media (prefers-reduced-motion: reduce) {
    * { animation-duration: .001s !important; transition-duration: .001s !important; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="title"><span class="mark"></span>Schedule <span class="sub">saved &amp; synced</span></div>
    <div class="header-actions">
      <button class="ghost-btn" id="help-btn" title="Take a quick tour">Tour</button>
      <a class="back" href="index.html">← Atlas</a>
    </div>
  </header>

  <div class="sync-bar" id="sync-bar">
    <span class="sync-dot"></span>
    <span id="sync-text">Local only — not synced</span>
    <button type="button" id="sync-btn" class="ghost-btn sync-btn">Sign in to sync</button>
    <form class="sync-form" id="sync-form" hidden autocomplete="on">
      <input type="email" id="sync-email" placeholder="email" autocomplete="username">
      <input type="password" id="sync-pass" placeholder="password" autocomplete="current-password">
      <button type="submit">Go</button>
      <button type="button" id="sync-cancel">Cancel</button>
    </form>
  </div>

  <form class="composer" id="add-form" autocomplete="off">
    <div class="composer-main">
      <input type="text" id="task-input" placeholder="What needs doing?" required>
      <button type="submit" class="add-btn" title="Add task">+</button>
    </div>
    <div class="composer-opts">
      <div class="opt-row" id="when-group">
        <span class="opt-label">When</span>
        <button type="button" class="chip active" data-when="none">None</button>
        <button type="button" class="chip" data-when="today">Today</button>
        <button type="button" class="chip" data-when="tomorrow">Tomorrow</button>
        <button type="button" class="chip" data-when="weekend">Weekend</button>
        <button type="button" class="chip" data-when="nextweek">Next wk</button>
        <button type="button" class="chip cal-chip" data-when="custom" id="cal-chip">Pick date</button>
      </div>
      <div class="opt-row" id="time-group">
        <span class="opt-label">Time</span>
        <button type="button" class="chip active" data-time="none">No time</button>
        <button type="button" class="chip" data-time="09:00">9:00</button>
        <button type="button" class="chip" data-time="12:00">12:00</button>
        <button type="button" class="chip" data-time="18:00">18:00</button>
        <button type="button" class="chip time-chip" data-time="custom" id="time-chip">Pick time</button>
      </div>
      <div class="opt-row" id="prio-group">
        <span class="opt-label">Priority</span>
        <button type="button" class="chip" data-prio="low"><span class="pdot"></span>Low</button>
        <button type="button" class="chip active" data-prio="med"><span class="pdot"></span>Med</button>
        <button type="button" class="chip" data-prio="high"><span class="pdot"></span>High</button>
      </div>
    </div>
  </form>

  <div class="tabs" id="tabs"></div>
  <div class="tasks" id="tasks"></div>

  <div class="controls">
    <button type="button" id="remind-btn" class="ghost-btn" title="Desktop notification when a timed task is due">Reminders: off</button>
    <button type="button" id="ics-btn" class="ghost-btn" title="Download dated tasks as a calendar file (.ics)">Add to calendar</button>
    <button type="button" id="export-btn" class="ghost-btn" title="Download all tasks as JSON">Export</button>
    <button type="button" id="import-btn" class="ghost-btn" title="Replace tasks from a JSON file">Import</button>
    <input type="file" id="import-file" accept="application/json" hidden>
    <span id="data-msg"></span>
  </div>

  <footer>data lives in your browser · back it up with Export</footer>
</div>

<div class="tour" id="tour" hidden>
  <div class="tour-hl" id="tour-hl"></div>
  <div class="tour-tip" id="tour-tip">
    <div class="tour-n" id="tour-n">1 / 9</div>
    <div class="tour-h" id="tour-h"></div>
    <div class="tour-t" id="tour-t"></div>
    <div class="tour-nav">
      <button id="tour-skip">Skip</button>
      <div class="tour-dots" id="tour-dots"></div>
      <button id="tour-back">Back</button>
      <button id="tour-next" class="primary">Next</button>
    </div>
  </div>
</div>

<script>
const STORAGE_KEY = 'atlas_tasks';
const TABS = [
  { id: 'today', label: 'Today' },
  { id: 'week', label: 'This Week' },
  { id: 'all', label: 'All' },
  { id: 'done', label: 'Done' },
];
const REDUCED = matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
const esc = s => String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');

function load() { try { return JSON.parse(localStorage.getItem(STORAGE_KEY)) || []; } catch { return []; } }
let syncDoc = null, syncReady = false;
function save(t) {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(t));
  if (syncDoc && syncReady) syncDoc.set({ tasks: t, updated: Date.now() }).catch(() => flashMsg('Sync failed — saved locally', 'err', 3000));
}

function ymd(d) { d = (d instanceof Date) ? d : new Date(d); return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0'); }
function today() { return ymd(new Date()); }
function weekEnd() { const d = new Date(); d.setDate(d.getDate()+7); return ymd(d); }
function isOverdue(t) { return t.due && t.due < today() && !t.done; }
function isToday(t) { return t.due === today(); }
function isThisWeek(t) { return t.due && t.due >= today() && t.due <= weekEnd(); }

let activeTab = 'today';
let tasks = load();

function counts() {
  return {
    today: tasks.filter(x => !x.done && isToday(x)).length,
    week: tasks.filter(x => !x.done && isThisWeek(x)).length,

  let unsub = null, firstSnap = true;
  btn.addEventListener('click', () => { if (auth.currentUser) auth.signOut(); else { btn.hidden = true; form.hidden = false; document.getElementById('sync-email').focus(); } });
  document.getElementById('sync-cancel').addEventListener('click', () => { form.hidden = true; btn.hidden = false; });
  form.addEventListener('submit', e => {
    e.preventDefault();
    const email = document.getElementById('sync-email').value.trim(), pass = document.getElementById('sync-pass').value;
    if (!email || !pass) return;
    auth.signInWithEmailAndPassword(email, pass).catch(err => {
      if (err.code === 'auth/user-not-found') { if (confirm('No account for ' + email + '. Create one to sync?')) auth.createUserWithEmailAndPassword(email, pass).catch(e2 => flashMsg('Sign up failed: ' + e2.message, 'err', 4500)); }
      else flashMsg('Sign in failed: ' + err.message, 'err', 4500);
    });
  });
  auth.onAuthStateChanged(user => {
    if (user) {
      form.hidden = true; btn.hidden = false; btn.textContent = 'Sign out'; text.textContent = 'Synced · ' + user.email; dot.classList.add('on');
      document.getElementById('sync-pass').value = ''; firstSnap = true; syncReady = false;
      syncDoc = db.collection('schedule').doc(user.uid);
      unsub = syncDoc.onSnapshot(snap => {
        if (snap.metadata.hasPendingWrites) return;
        if (!snap.exists) { syncReady = true; if (tasks.length) save(tasks); firstSnap = false; return; }
        const cloud = (snap.data() && snap.data().tasks) || [];
        if (firstSnap) { const cids = new Set(cloud.map(x => String(x.id))); const extra = tasks.filter(x => !cids.has(String(x.id))); tasks = cloud.concat(extra); localStorage.setItem(STORAGE_KEY, JSON.stringify(tasks)); firstSnap = false; syncReady = true; if (extra.length) save(tasks); }
        else { tasks = cloud; localStorage.setItem(STORAGE_KEY, JSON.stringify(tasks)); }
        taskEls.forEach(el => el.remove()); taskEls.clear(); renderAll();
      }, err => flashMsg('Sync error: ' + err.message, 'err', 4500));
    } else {
      if (unsub) { unsub(); unsub = null; } syncDoc = null; syncReady = false;
      btn.textContent = 'Sign in to sync'; text.textContent = 'Local only — not synced'; dot.classList.remove('on');
    }
  });
})();

// ── Guided tour ──
const TOUR = [
  { sel: null, h: 'Welcome to Schedule', t: 'A quick tour of how it works. Skip anytime — replay it from the Tour button up top.' },
  { sel: '.composer-main', h: 'Add a task', t: 'Type what you need to do and press Enter (or the + button). That’s the only required field.' },
  { sel: '#when-group', h: 'Set when it’s due', t: 'Quick days, or “Pick date” for a calendar. “None” keeps it undated.' },
  { sel: '#time-group', h: 'Add a time', t: 'A time makes reminders precise to the minute. Leave it as “No time” for an all-day task.' },
  { sel: '#prio-group', h: 'Priority', t: 'Low, Med, or High — shown as a small colored dot next to the task.' },
  { sel: '#tabs', h: 'Filter your view', t: 'Today, This Week, All, Done — and an Overdue tab appears when you need it. Counts are built in.' },
  { sel: '#remind-btn', h: 'Reminders & calendar', t: 'Turn on desktop reminders, or “Add to calendar” to get alerts on your phone and watch.' },
  { sel: '#sync-bar', h: 'Sync across devices', t: 'Sign in to share one task list on your PC and phone in real time.' },
  { sel: null, h: 'You’re set', t: 'Add your first task. The Tour button up top brings this back anytime.' },
];
let ti = 0;
const tourEl = document.getElementById('tour'), tourHl = document.getElementById('tour-hl'), tourTip = document.getElementById('tour-tip');
function tourDots() { document.getElementById('tour-dots').innerHTML = TOUR.map((_, i) => `<span class="${i === ti ? 'on' : ''}"></span>`).join(''); }
function placeTour() {
  const s = TOUR[ti];
  if (!s.sel) { tourHl.style.opacity = '0'; tourHl.style.width = '0'; tourHl.style.height = '0'; tourHl.style.left = '50vw'; tourHl.style.top = '50vh'; tourTip.style.transform = 'translate(-50%,-50%)'; tourTip.style.left = '50%'; tourTip.style.top = '50%'; return; }
  const el = document.querySelector(s.sel); if (!el) return;
  const r = el.getBoundingClientRect(), pad = 8;
  tourHl.style.opacity = '1'; tourHl.style.top = (r.top-pad)+'px'; tourHl.style.left = (r.left-pad)+'px'; tourHl.style.width = (r.width+pad*2)+'px'; tourHl.style.height = (r.height+pad*2)+'px';
  tourTip.style.transform = 'none';
  const tw = tourTip.offsetWidth, th = tourTip.offsetHeight;
  let left = Math.max(16, Math.min(r.left + r.width/2 - tw/2, innerWidth - tw - 16));
  let top = (r.bottom + 14 + th < innerHeight) ? r.bottom + 14 : Math.max(16, r.top - 14 - th);
  tourTip.style.left = left+'px'; tourTip.style.top = top+'px';
}
function showTour(i) {
  ti = Math.max(0, Math.min(TOUR.length-1, i)); const s = TOUR[ti];
  document.getElementById('tour-n').textContent = (ti+1) + ' / ' + TOUR.length;
  document.getElementById('tour-h').textContent = s.h;
  document.getElementById('tour-t').textContent = s.t;
  document.getElementById('tour-back').style.visibility = ti === 0 ? 'hidden' : 'visible';
  document.getElementById('tour-next').textContent = ti === TOUR.length-1 ? 'Done' : 'Next';
  tourDots();
  if (s.sel) { const el = document.querySelector(s.sel); if (el) el.scrollIntoView({ block: 'center', behavior: 'auto' }); }
  requestAnimationFrame(placeTour);
}
function startTour() { tourEl.hidden = false; showTour(0); }
function endTour() { tourEl.hidden = true; localStorage.setItem('atlas_sched_tour_done', '1'); }
document.getElementById('help-btn').addEventListener('click', startTour);
document.getElementById('tour-skip').addEventListener('click', endTour);
document.getElementById('tour-back').addEventListener('click', () => showTour(ti-1));
document.getElementById('tour-next').addEventListener('click', () => { if (ti === TOUR.length-1) endTour(); else showTour(ti+1); });
addEventListener('resize', () => { if (!tourEl.hidden) placeTour(); });
addEventListener('keydown', e => { if (tourEl.hidden) return; if (e.key === 'Escape') endTour(); else if (e.key === 'ArrowRight') document.getElementById('tour-next').click(); else if (e.key === 'ArrowLeft' && ti > 0) showTour(ti-1); });
if (!localStorage.getItem('atlas_sched_tour_done')) setTimeout(startTour, 650);

document.getElementById('task-input').focus();
</script>
