<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Thailand's Green Map — Ship Love. Ship Light.</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  :root{
    --bg:#080b12; --text:#f4f6fb; --muted:#8b95a7; --dim:#2c3340;
    --dhl-yellow:#FFCC00; --dhl-red:#D40511; --green:#34d399;
    --sans:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
    --mono:'JetBrains Mono',Consolas,monospace;
  }
  html,body{height:100%}
  body{background:
      radial-gradient(1200px 600px at 78% 42%, rgba(255,204,0,0.10), transparent 55%),
      radial-gradient(900px 700px at 50% 120%, rgba(52,211,153,0.08), transparent 60%),
      var(--bg);
    color:var(--text); font-family:var(--sans); -webkit-font-smoothing:antialiased;
    min-height:100vh; overflow:hidden; position:relative;}
  ::selection{background:var(--dhl-yellow);color:#000}

  .head{position:fixed; top:26px; left:0; right:0; text-align:center; z-index:5; pointer-events:none;}
  .tag{display:inline-flex;align-items:center;gap:8px;font-family:var(--mono);font-size:12px;letter-spacing:.12em;color:var(--muted);}
  .tag b{background:var(--dhl-yellow);color:var(--dhl-red);font-weight:800;padding:2px 8px;border-radius:5px;letter-spacing:.02em;}
  .title{font-weight:800;font-size:clamp(20px,3.2vw,30px);margin-top:10px;}
  .title .y{color:var(--dhl-yellow)}

  /* big counter */
  .counter{position:fixed; top:96px; left:0; right:0; text-align:center; z-index:5; pointer-events:none;}
  .counter b{font-family:var(--mono); font-weight:700; font-size:clamp(34px,7vw,72px); color:var(--green);
    text-shadow:0 0 30px rgba(52,211,153,.4); letter-spacing:-.01em;}
  .counter span{display:block; color:var(--muted); font-size:13px; letter-spacing:.08em; text-transform:uppercase; margin-top:4px;}

  .mapwrap{position:absolute; inset:0; display:flex; align-items:center; justify-content:center;}
  svg{width:min(1320px,98vw); height:auto; display:block; overflow:visible;}

  .grid line{stroke:rgba(255,255,255,0.045); stroke-width:1;}
  .arc{fill:none; stroke:var(--green); stroke-width:1.6; opacity:.8;
    stroke-linecap:round; transition:stroke-dashoffset 1.1s ease;}
  .dest{fill:var(--green);}
  .ring{fill:none; stroke:var(--green); stroke-width:1; opacity:.5;}
  .lbl{fill:#cdd6e6; font-family:var(--mono); font-size:9px; opacity:0; transition:opacity .5s;}
  .lbl.on{opacity:.85;}
  .origin-dot{fill:var(--dhl-yellow);}
  .origin-glow{fill:var(--dhl-yellow);}
  .origin-lbl{fill:var(--dhl-yellow); font-family:var(--mono); font-size:12px; font-weight:700;}

  .foot{position:fixed; bottom:24px; left:0; right:0; text-align:center; z-index:5;}
  .foot .big{font-weight:900; font-size:clamp(18px,3vw,28px); letter-spacing:-.01em;}
  .foot .big .y{color:var(--dhl-yellow)}
  .foot .sub{color:var(--muted); font-size:12px; margin-top:4px; font-family:var(--mono);}
  .replay{position:fixed; bottom:22px; right:24px; font-family:var(--mono); font-size:12px; color:#000;
    background:var(--dhl-yellow); border:none; border-radius:999px; padding:9px 16px; cursor:pointer; font-weight:700; z-index:6;}
  .hint{position:fixed; bottom:26px; left:24px; font-family:var(--mono); font-size:11px; color:var(--dim); z-index:6;}
</style>
</head>
<body>
  <div class="head">
    <div class="tag"><b>DHL</b> Express × UOB Wonder Lab 2026</div>
    <div class="title">Thailand's <span class="y">Green Map</span></div>
  </div>

  <div class="counter"><b id="num">0 kg</b><span>CO₂ cut by ServicePoint customers this month</span></div>

  <div class="mapwrap">
    <svg id="map" viewBox="0 0 1000 500" aria-hidden="true">
      <g class="grid" id="grid"></g>
      <g id="arcs"></g>
      <g id="dots"></g>
    </svg>
  </div>

  <div class="foot">
    <div class="big">Ship Love. <span class="y">Ship Light.</span></div>
    <div class="sub">every green shipment — from Thailand to the world</div>
  </div>
  <div class="hint">press <b>R</b> to replay</div>
  <button class="replay" id="replay">↻ Replay</button>

<script>
  const W=1000,H=500;
  const proj=(lat,lon)=>({x:(lon+180)/360*W, y:(90-lat)/180*H});
  const ORIGIN={n:'BANGKOK',lat:13.7,lon:100.5};
  const DESTS=[
    {n:'Tokyo',lat:35.7,lon:139.7},     {n:'Seoul',lat:37.6,lon:127.0},
    {n:'Singapore',lat:1.35,lon:103.8}, {n:'Sydney',lat:-33.9,lon:151.2},
    {n:'Dubai',lat:25.2,lon:55.3},      {n:'Mumbai',lat:19.1,lon:72.9},
    {n:'London',lat:51.5,lon:-0.1},     {n:'Paris',lat:48.9,lon:2.35},
    {n:'Berlin',lat:52.5,lon:13.4},     {n:'New York',lat:40.7,lon:-74.0},
    {n:'Los Angeles',lat:34.0,lon:-118.2}, {n:'São Paulo',lat:-23.5,lon:-46.6},
    {n:'Cape Town',lat:-33.9,lon:18.4},
  ];
  const TARGET = 1284; // kg this month (illustrative)
  const SVGNS='http://www.w3.org/2000/svg';
  const $=id=>document.getElementById(id);
  const mk=(t,a)=>{const e=document.createElementNS(SVGNS,t); for(const k in a) e.setAttribute(k,a[k]); return e;};

  // graticule
  (function(){
    const g=$('grid');
    for(let lon=-180;lon<=180;lon+=30){const x=(lon+180)/360*W; g.appendChild(mk('line',{x1:x,y1:0,x2:x,y2:H}));}
    for(let lat=-90;lat<=90;lat+=30){const y=(90-lat)/180*H; g.appendChild(mk('line',{x1:0,y1:y,x2:W,y2:y}));}
  })();

  const o=proj(ORIGIN.lat,ORIGIN.lon);
  let arcEls=[], labelEls=[];

  function build(){
    $('arcs').innerHTML=''; $('dots').innerHTML=''; arcEls=[]; labelEls=[];
    // arcs + flowing particles
    DESTS.forEach((d,i)=>{
      const p=proj(d.lat,d.lon);
      const dx=p.x-o.x, dy=p.y-o.y, dist=Math.hypot(dx,dy);
      const cx=(o.x+p.x)/2, cy=(o.y+p.y)/2 - dist*0.28;
      const dd=`M ${o.x} ${o.y} Q ${cx} ${cy} ${p.x} ${p.y}`;
      const path=mk('path',{class:'arc',d:dd,id:'arc'+i}); $('arcs').appendChild(path); arcEls.push(path);
      // flowing particle along the arc
      const part=mk('circle',{r:2.4,fill:'#FFCC00',opacity:.9});
      const am=mk('animateMotion',{dur:(2.6+i*0.12)+'s',repeatCount:'indefinite',begin:(i*0.2)+'s'});
      am.appendChild(mk('mpath',{href:'#arc'+i}));
      part.appendChild(am); $('arcs').appendChild(part);
    });
    // destination dots + labels
    DESTS.forEach((d,i)=>{
      const p=proj(d.lat,d.lon);
      $('dots').appendChild(mk('circle',{class:'dest',cx:p.x,cy:p.y,r:3}));
      const anchor = p.x>900?'end':'start';
      const lx = anchor==='end'? p.x-7 : p.x+7;
      const lbl=mk('text',{class:'lbl',x:lx,y:p.y+3,'text-anchor':anchor}); lbl.textContent=d.n;
      $('dots').appendChild(lbl); labelEls.push(lbl);
    });
    // origin: pulsing glow + dot + label
    const glow=mk('circle',{class:'origin-glow',cx:o.x,cy:o.y,r:5,opacity:.6});
    glow.appendChild(mk('animate',{attributeName:'r',values:'5;22;5',dur:'2.6s',repeatCount:'indefinite'}));
    glow.appendChild(mk('animate',{attributeName:'opacity',values:'.6;0;.6',dur:'2.6s',repeatCount:'indefinite'}));
    $('dots').appendChild(glow);
    $('dots').appendChild(mk('circle',{class:'origin-dot',cx:o.x,cy:o.y,r:5}));
    const ol=mk('text',{class:'origin-lbl',x:o.x,y:o.y+20,'text-anchor':'middle'}); ol.textContent='BANGKOK';
    $('dots').appendChild(ol);
  }

  let gen=0;
  function countUp(){
    const myGen=++gen, t0=performance.now();
    (function step(now){
      if(myGen!==gen) return;
      const p=Math.min(1,(now-t0)/1900), v=Math.round(TARGET*(1-Math.pow(1-p,3)));
      $('num').textContent=v.toLocaleString()+' kg';
      if(p<1) requestAnimationFrame(step);
    })(t0);
  }

  function play(){
    build();
    // draw arcs (stagger) + reveal labels
    arcEls.forEach((path,i)=>{
      const len=path.getTotalLength();
      path.style.strokeDasharray=len; path.style.strokeDashoffset=len; path.style.transition='none';
      void path.getBBox();
      setTimeout(()=>{ path.style.transition='stroke-dashoffset 1.1s ease';
        path.style.strokeDashoffset='0';
        const l=labelEls[i]; if(l) setTimeout(()=>l.classList.add('on'),500);
      }, 200 + i*140);
    });
    countUp();
  }

  $('replay').addEventListener('click',play);
  document.addEventListener('keydown',e=>{ if(e.key==='r'||e.key==='R'||e.key===' '){ e.preventDefault(); play(); }});
  play();
</script>
</body>
</html>
