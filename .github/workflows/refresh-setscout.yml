name: Refresh SETScout data

# Auto-runs the engine daily so today.json is never stale.
#
# WHY TWO TIMES, OFF THE HOUR (changed 2026-11-07)
# The old single "0 11 * * *" run was started 3-9 hours late by GitHub, and a
# run that finishes after midnight Thai time (17:00 UTC) following a trading day
# is handed the PREVIOUS session's closes by Yahoo - 11 times between 12 Oct and
# 6 Nov. Two earlier, off-the-hour attempts (17:17 and 20:47 Thai time) give two
# chances to land before midnight, and the "keep newer prices" step below stops
# a late run from replacing a good file with older closes.
on:
  schedule:
    - cron: "17 10 * * *"    # 10:17 UTC = 17:17 Thailand (SET closes ~16:40)
    - cron: "47 13 * * *"    # 13:47 UTC = 20:47 Thailand, the second chance
  workflow_dispatch:          # ...and lets you run it manually from the Actions tab

permissions:
  contents: write             # allow committing the refreshed today.json

# Two runs must never push at the same moment.
concurrency:
  group: refresh-setscout
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    # Exposed at job level so the deploy step's `if` can test it. A step-level
    # env is evaluated after `if`, so it cannot be used to gate the step.
    env:
      FIREBASE_SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        # pandas and numpy pinned to the versions every report was run on
        # (team repo requirements.txt). yfinance stays unpinned on purpose: it
        # has to follow Yahoo's changes, or the daily download breaks.
        run: pip install --quiet pandas==3.0.6 numpy==2.4.6 yfinance

      - name: Run the engine
        run: python setscout/run_today.py

      # Fail LOUDLY, before the commit step. The commit is conditional
      # (`git diff --staged --quiet || git commit`), so a crashed engine would
      # commit nothing and report nothing - a silent failure path with no alarm.
      # A non-zero exit fails the job, and GitHub emails the repo owner.
      - name: Verify the refresh is healthy
        run: python setscout/verify_today.py

      # A run that lands after midnight Thai time can get older closes than the
      # file already published. Keep the published file in that case.
      - name: Keep newer prices if this run got older ones
        run: |
          python - <<'PY'
          import json, subprocess
          new = json.load(open("setscout/today.json", encoding="utf-8")).get("prices_asof")
          try:
              raw = subprocess.run(["git", "show", "HEAD:setscout/today.json"],
                                   capture_output=True, check=True).stdout
              old = json.loads(raw.decode("utf-8-sig")).get("prices_asof")
          except Exception:
              old = None
          print(f"published closes: {old}  this run: {new}")
          if new and old and new < old:
              print(f"::warning::this run got closes from {new}, older than the published {old}; keeping the published file")
              subprocess.run(["git", "checkout", "--", "setscout/today.json"], check=True)
          PY

      - name: Commit refreshed data (only if it changed)
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add setscout/today.json
          git diff --staged --quiet || git commit -m "chore(setscout): daily data refresh"
          git push

      # GitHub Pages serves this repo directly, so the commit above is enough
      # for the mirror. Firebase is a separate host and needs its own push -
      # without this step the refresh lands in git and the live site keeps
      # serving whatever was last deployed by hand.
      - name: Deploy to Firebase Hosting
        if: env.FIREBASE_SA != ''
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          # firebase-tools >= 15.34.1 checks serviceusage.services.get before
          # deploying. The deploy account (firebase-adminsdk-fbsvc) was given the
          # "Service Usage Consumer" role on 2026-11-06 for this. If deploys start
          # failing with a 403 again, check that role is still there.
          channelId: live
          projectId: setscout-th

      # Say so loudly rather than silently skipping, so a missing secret does
      # not look like a working deploy.
      - name: Warn when the deploy secret is absent
        if: env.FIREBASE_SA == ''
        run: |
          echo "::warning::FIREBASE_SERVICE_ACCOUNT is not set - data was committed but Firebase was NOT redeployed."
          {
            echo "## Firebase not deployed"
            echo ""
            echo "\`FIREBASE_SERVICE_ACCOUNT\` is missing from this repository's Actions secrets,"
            echo "so today.json was committed but the live site was not updated."
            echo ""
            echo "Firebase console -> Project settings -> Service accounts -> Generate new private key,"
            echo "then add it as a repository secret named \`FIREBASE_SERVICE_ACCOUNT\`."
          } >> "$GITHUB_STEP_SUMMARY"
