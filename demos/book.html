<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Atlas · The Handshake</title>
<link rel="manifest" href="../manifest.json">
<link rel="icon" type="image/png" href="../icons/atlas-favicon.png">
<link rel="apple-touch-icon" href="../icons/atlas-192.png">
<meta name="theme-color" content="#21214d">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg-base: #0a0a14;
    --text: #e8e8f0;
    --muted: #8a8aa8;
    --accent: #818cf8;
    --accent2: #22d3ee;
  }
  html, body { height: 100%; overflow: hidden; }
  body {
    background: radial-gradient(ellipse 90% 70% at 30% -10%, #21214d 0%, #0a0a14 62%), var(--bg-base);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }

  #book-canvas { position: fixed; inset: 0; width: 100%; height: 100%; z-index: 1; }

  .ui { position: fixed; z-index: 3; pointer-events: none; }
  .ui > * { pointer-events: auto; }

  .top {
    top: 0; left: 0; right: 0;
    padding: 28px 32px;
    display: flex; justify-content: space-between; align-items: flex-start;
  }
  .brand .title {
    font-size: 24px; font-weight: 800; letter-spacing: -0.01em;
    background: linear-gradient(95deg, #818cf8 0%, #22d3ee 100%);
    -webkit-background-clip: text; background-clip: text;
    -webkit-text-fill-color: transparent;
  }
  .brand .subtitle {
    font-size: 11px; color: var(--muted); margin-top: 4px;
    letter-spacing: 0.18em; text-transform: uppercase;
  }
  .back {
    color: var(--muted); text-decoration: none; font-size: 12px;
    padding: 7px 12px; border: 1px solid rgba(129,140,248,0.18); border-radius: 8px;
    backdrop-filter: blur(8px); background: rgba(15,15,30,0.4);
    transition: all 0.18s;
  }
  .back:hover { color: var(--text); border-color: rgba(129,140,248,0.45); background: rgba(129,140,248,0.12); }

  .step-readout {
    position: fixed; left: 50%; transform: translateX(-50%);
    top: 28px; z-index: 4; text-align: center; pointer-events: none;
    transition: opacity 0.4s;
    opacity: 0;
  }
  .step-readout.visible { opacity: 1; }
  .step-readout .label {
    font-size: 10px; letter-spacing: 0.25em; color: var(--accent2);
    text-transform: uppercase; font-weight: 700;
  }
  .step-readout .title {
    font-size: 18px; font-weight: 700; margin-top: 2px;
    color: var(--text);
  }

  .bottom {
    bottom: 0; left: 0; right: 0;
    padding: 28px 32px;
    display: flex; justify-content: space-between; align-items: flex-end;
    font-size: 11px; color: #555570; letter-spacing: 0.08em;
  }
  .hint { text-transform: uppercase; }
  .controls { display: flex; gap: 8px; }
  .controls button {
    background: rgba(15,15,30,0.55);
    border: 1px solid rgba(129,140,248,0.22);
    color: var(--muted); padding: 7px 14px; border-radius: 999px;
    font-size: 11px; font-weight: 600; cursor: pointer;
    letter-spacing: 0.05em; text-transform: uppercase;
    transition: all 0.14s; font-family: inherit; backdrop-filter: blur(8px);
  }
  .controls button:hover { color: var(--text); border-color: var(--accent); background: rgba(129,140,248,0.18); }
  .controls button.active { color: #fff; border-color: var(--accent); background: rgba(129,140,248,0.28); }

  @media (max-width: 600px) {
    .top, .bottom { padding: 18px 18px; }
    .brand .title { font-size: 18px; }
    .step-readout .title { font-size: 14px; }
    .step-readout .label { font-size: 9px; }
  }
</style>
</head>
<body>

<canvas id="book-canvas"></canvas>

<div class="step-readout" id="step-readout">
  <div class="label">step <span id="step-num">—</span> of 6</div>
  <div class="title" id="step-title">&nbsp;</div>
</div>

<div class="ui top">
  <div class="brand">
    <div class="title">The Handshake</div>
    <div class="subtitle">Claude × Codex × You</div>
  </div>
  <a class="back" href="../index.html">← Atlas</a>
</div>

<div class="ui bottom">
  <div class="hint">drag to spin · scroll to zoom · click to pause</div>
  <div class="controls">
    <button type="button" id="auto-btn" class="active">Auto</button>
    <button type="button" id="open-btn">Open</button>
    <button type="button" id="close-btn">Close</button>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
// ────────── Content ──────────────────────────────────────────────
const STEPS = [
  { n: 1, title: 'Build',
    body: 'Claude writes the code and commits. Every non-trivial commit includes a "### Verify" block listing 3-6 specific, falsifiable checks.' },
  { n: 2, title: 'Open the prompt',
    body: 'Run scripts\\review.bat in the repo. It prints a Codex-ready prompt with the commit SHA, subject, and a target REVIEWS file path.' },
  { n: 3, title: 'Hand to Codex',
    body: 'Paste the printed block into Codex. Codex reads the diff, checks each Verify item, and reports PASS / FAIL / NOTE with one-sentence evidence.' },
  { n: 4, title: 'Decide',
    body: 'You read the review. All PASS — merge it. Any FAIL — hand back to Claude with the specific items to fix. You are the only one who merges.' },
  { n: 5, title: 'Re-build',
    body: 'For every FAIL, Claude addresses the feedback in a NEW commit. Never amend the old one. The audit trail stays clean.' },
  { n: 6, title: 'Loop',
    body: 'Use this on risky work — alpha logic, money handling, security code. Skip it on cosmetic commits, docs, hotfix one-liners. Discipline beats ceremony.' },
];

// ────────── Texture builders (CanvasTexture) ─────────────────────
const TEX_W = 1024, TEX_H = 1408; // ~5:7 ratio

function paperBase(ctx) {
  // Warm off-white background
  const g = ctx.createLinearGradient(0, 0, 0, TEX_H);
  g.addColorStop(0, '#f4f0e6');
  g.addColorStop(1, '#ece7d8');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, TEX_W, TEX_H);
  // Subtle grain
  for (let i = 0; i < 1200; i++) {
    ctx.fillStyle = `rgba(0,0,0,${Math.random() * 0.025})`;
    ctx.fillRect(Math.random() * TEX_W, Math.random() * TEX_H, 2, 2);
  }
}

function wrapText(ctx, text, x, y, maxWidth, lineHeight) {
  const words = text.split(' ');
  let line = '';
  for (const word of words) {
    const test = line + word + ' ';
    if (ctx.measureText(test).width > maxWidth && line.length) {
      ctx.fillText(line.trim(), x, y);
      line = word + ' '; y += lineHeight;
    } else {
      line = test;
    }
  }
  if (line.length) ctx.fillText(line.trim(), x, y);
}

function makePageTexture(step, total) {
  const c = document.createElement('canvas');
  c.width = TEX_W; c.height = TEX_H;
  const ctx = c.getContext('2d');
  paperBase(ctx);

  // Margin frame
  ctx.strokeStyle = 'rgba(33, 33, 77, 0.12)';
  ctx.lineWidth = 3;
  ctx.strokeRect(80, 80, TEX_W - 160, TEX_H - 160);

  // Step number (huge, indigo)
  ctx.fillStyle = '#21214d';
  ctx.font = 'bold 180px Georgia, serif';
  ctx.textAlign = 'left';
  ctx.fillText(String(step.n), 130, 290);

  // Accent rule under number
  ctx.strokeStyle = '#818cf8';
  ctx.lineWidth = 6;
  ctx.beginPath();
  ctx.moveTo(140, 330);
  ctx.lineTo(360, 330);
  ctx.stroke();

  // Title
  ctx.fillStyle = '#0a0a14';
  ctx.font = 'bold 76px Georgia, serif';
  ctx.fillText(step.title, 140, 470);

  // Body
  ctx.fillStyle = '#2f2f44';
  ctx.font = '40px Georgia, serif';
  wrapText(ctx, step.body, 140, 600, TEX_W - 280, 60);

  // Page number bottom-right
  ctx.fillStyle = 'rgba(33, 33, 77, 0.45)';
  ctx.font = 'italic 28px Georgia, serif';
  ctx.textAlign = 'right';
  ctx.fillText(`${step.n} / ${total}`, TEX_W - 130, TEX_H - 130);

  const tex = new THREE.CanvasTexture(c);
  tex.anisotropy = 8;
  return tex;
}

function makeCoverTexture() {
  const c = document.createElement('canvas');
  c.width = TEX_W; c.height = TEX_H;
  const ctx = c.getContext('2d');

  // Indigo-to-deeper gradient
  const g = ctx.createLinearGradient(0, 0, TEX_W, TEX_H);
  g.addColorStop(0, '#2c2c5e');
  g.addColorStop(0.55, '#21214d');
  g.addColorStop(1, '#15153a');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, TEX_W, TEX_H);

  // Subtle constellation dots
  for (let i = 0; i < 24; i++) {
    const x = 60 + Math.random() * (TEX_W - 120);
    const y = 60 + Math.random() * (TEX_H - 120);
    if (Math.abs(x - TEX_W / 2) < 280 && Math.abs(y - 480) < 320) continue;
    const r = 2 + Math.random() * 4;
    ctx.fillStyle = `rgba(180, 200, 255, ${0.35 + Math.random() * 0.4})`;
    ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill();
  }

  // Inner gold-ish frame
  ctx.strokeStyle = 'rgba(168, 152, 100, 0.45)';
  ctx.lineWidth = 4;
  ctx.strokeRect(100, 100, TEX_W - 200, TEX_H - 200);

  // Title — gradient text (drawn via clipping)
  ctx.save();
  ctx.font = 'bold 130px Georgia, serif';
  ctx.textAlign = 'center';
  const titleGrad = ctx.createLinearGradient(0, 380, TEX_W, 500);
  titleGrad.addColorStop(0, '#a8b0ff');
  titleGrad.addColorStop(0.6, '#dde2ff');
  titleGrad.addColorStop(1, '#7be0f0');
  ctx.fillStyle = titleGrad;
  ctx.fillText('THE', TEX_W / 2, 430);
  ctx.font = 'bold 150px Georgia, serif';
  ctx.fillText('HANDSHAKE', TEX_W / 2, 600);
  ctx.restore();

  // Decorative rule
  ctx.strokeStyle = 'rgba(168, 152, 100, 0.5)';
  ctx.lineWidth = 3;
  ctx.beginPath();
  ctx.moveTo(TEX_W / 2 - 220, 700);
  ctx.lineTo(TEX_W / 2 + 220, 700);
  ctx.stroke();

  // Subtitle
  ctx.fillStyle = 'rgba(220, 220, 240, 0.85)';
  ctx.font = 'italic 56px Georgia, serif';
  ctx.textAlign = 'center';
  ctx.fillText('Claude × Codex × You', TEX_W / 2, 800);

  // Footer
  ctx.fillStyle = 'rgba(168, 152, 100, 0.7)';
  ctx.font = '34px Georgia, serif';
  ctx.fillText('Atlas Field Manual', TEX_W / 2, TEX_H - 220);
  ctx.font = '24px Georgia, serif';
  ctx.fillText('vol. I', TEX_W / 2, TEX_H - 170);

  const tex = new THREE.CanvasTexture(c);
  tex.anisotropy = 8;
  return tex;
}

function makeBackCoverTexture() {
  const c = document.createElement('canvas');
  c.width = TEX_W; c.height = TEX_H;
  const ctx = c.getContext('2d');
  // Same indigo gradient
  const g = ctx.createLinearGradient(0, 0, TEX_W, TEX_H);
  g.addColorStop(0, '#15153a');
  g.addColorStop(1, '#21214d');
  ctx.fillStyle = g; ctx.fillRect(0, 0, TEX_W, TEX_H);
  // Single centered mark
  ctx.fillStyle = 'rgba(168, 152, 100, 0.55)';
  ctx.font = '70px Georgia, serif';
  ctx.textAlign = 'center';
  ctx.fillText('⚭', TEX_W / 2, TEX_H / 2 + 25);
  const tex = new THREE.CanvasTexture(c);
  tex.anisotropy = 8;
  return tex;
}

// ────────── Three.js setup ───────────────────────────────────────
const canvas = document.getElementById('book-canvas');
const renderer = new THREE.WebGLRenderer({ canvas, alpha: true, antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(38, innerWidth / innerHeight, 0.1, 100);
camera.position.set(0, 0.6, 4.6);
camera.lookAt(0, 0, 0);

// Lights
scene.add(new THREE.AmbientLight(0xffffff, 0.45));
const key = new THREE.DirectionalLight(0xcdd4ff, 1.3);
key.position.set(2.5, 4, 4); scene.add(key);
const rim = new THREE.PointLight(0x22d3ee, 1.4, 9);
rim.position.set(-2.5, -0.5, 2); scene.add(rim);
const fill = new THREE.PointLight(0x818cf8, 0.9, 8);
fill.position.set(0.6, 2, -2); scene.add(fill);

// ────────── Geometry ─────────────────────────────────────────────
const W = 1.45, H = 1.95, COVER_T = 0.025;
const N_PAGES = STEPS.length;            // 6
const PAGE_GAP = (COVER_T * 2 - 0.015) / (N_PAGES + 1);

function hingedPlane(w, h, mat) {
  const geom = new THREE.PlaneGeometry(w, h, 1, 1);
  geom.translate(w / 2, 0, 0); // pivot at left
  return new THREE.Mesh(geom, mat);
}

const book = new THREE.Group();
scene.add(book);

// Covers — textured
const coverTex = makeCoverTexture();
const backTex = makeBackCoverTexture();
const coverMat = new THREE.MeshPhongMaterial({
  map: coverTex, shininess: 60, specular: 0x818cf8, side: THREE.DoubleSide,
});
const backCoverMat = new THREE.MeshPhongMaterial({
  map: backTex, shininess: 55, specular: 0x818cf8, side: THREE.DoubleSide,
});

const frontCover = hingedPlane(W, H, coverMat);
frontCover.position.set(0, 0, COVER_T);
book.add(frontCover);

const backCover = hingedPlane(W, H, backCoverMat);
backCover.position.set(0, 0, -COVER_T);
book.add(backCover);

// Spine
const spineDepth = COVER_T * 2 + 0.005;
const spineGeom = new THREE.BoxGeometry(0.045, H, spineDepth);
const spineMat = new THREE.MeshPhongMaterial({
  color: 0x141432, shininess: 30, specular: 0x404090,
});
const spine = new THREE.Mesh(spineGeom, spineMat);
spine.position.set(-0.022, 0, 0);
book.add(spine);

// Pages — each has step content
const pages = [];
for (let i = 0; i < N_PAGES; i++) {
  const tex = makePageTexture(STEPS[i], N_PAGES);
  const mat = new THREE.MeshPhongMaterial({
    map: tex, shininess: 8, side: THREE.DoubleSide,
  });
  const p = hingedPlane(W * 0.985, H * 0.985, mat);
  // Stack between covers
  const t = (i + 1) / (N_PAGES + 1);
  const z = (COVER_T - PAGE_GAP) - i * PAGE_GAP;
  p.position.set(0, 0, z);
  book.add(p);
  pages.push(p);
}

// Initial pose
book.rotation.x = -0.18;
book.rotation.y = 0.20;

// ────────── Interaction state ────────────────────────────────────
let mode = 'auto';
let openness = 0;
let openTarget = 0;
let paused = false;
let userYaw = 0, userPitch = 0, userYawT = 0, userPitchT = 0;
let zoom = 1.0, zoomT = 1.0;
let dragging = false, lastX = 0, lastY = 0, dragMoved = false;

canvas.addEventListener('mousedown', (e) => {
  dragging = true; dragMoved = false;
  lastX = e.clientX; lastY = e.clientY;
});
canvas.addEventListener('mousemove', (e) => {
  if (!dragging) return;
  const dx = e.clientX - lastX, dy = e.clientY - lastY;
  lastX = e.clientX; lastY = e.clientY;
  if (Math.abs(dx) > 2 || Math.abs(dy) > 2) dragMoved = true;
  userYawT += dx * 0.008;
  userPitchT = Math.max(-1.2, Math.min(1.2, userPitchT + dy * 0.006));
});
addEventListener('mouseup', (e) => {
  if (dragging && !dragMoved) { paused = !paused; }
  dragging = false;
});
addEventListener('mouseleave', () => { dragging = false; });
canvas.addEventListener('wheel', (e) => {
  e.preventDefault();
  zoomT = Math.max(0.5, Math.min(2.0, zoomT * (1 + e.deltaY * 0.0015)));
}, { passive: false });

let touchId = null;
canvas.addEventListener('touchstart', (e) => {
  if (e.touches.length === 1) {
    touchId = e.touches[0].identifier;
    lastX = e.touches[0].clientX; lastY = e.touches[0].clientY;
    dragging = true; dragMoved = false;
  }
});
canvas.addEventListener('touchmove', (e) => {
  if (!dragging) return;
  for (const t of e.touches) {
    if (t.identifier === touchId) {
      const dx = t.clientX - lastX, dy = t.clientY - lastY;
      lastX = t.clientX; lastY = t.clientY;
      if (Math.abs(dx) > 2 || Math.abs(dy) > 2) dragMoved = true;
      userYawT += dx * 0.008;
      userPitchT = Math.max(-1.2, Math.min(1.2, userPitchT + dy * 0.006));
    }
  }
});
canvas.addEventListener('touchend', () => {
  if (dragging && !dragMoved) paused = !paused;
  dragging = false; touchId = null;
});

const autoBtn = document.getElementById('auto-btn');
const openBtn = document.getElementById('open-btn');
const closeBtn = document.getElementById('close-btn');
function setMode(m) {
  mode = m;
  autoBtn.classList.toggle('active', m === 'auto');
  openBtn.classList.toggle('active', m === 'open');
  closeBtn.classList.toggle('active', m === 'close');
  if (m === 'open') openTarget = 1;
  if (m === 'close') openTarget = 0;
  if (m === 'auto') paused = false;
}
autoBtn.addEventListener('click', () => setMode('auto'));
openBtn.addEventListener('click', () => setMode('open'));
closeBtn.addEventListener('click', () => setMode('close'));

// Resize
function resize() {
  renderer.setSize(innerWidth, innerHeight, false);
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
}
addEventListener('resize', resize);
resize();

// Step readout
const stepReadout = document.getElementById('step-readout');
const stepNum = document.getElementById('step-num');
const stepTitle = document.getElementById('step-title');
let lastStep = -1;
function updateReadout() {
  // The "current step" is whichever page has just become visible (last fully-flipped page).
  // openness goes 0..1. Each page's stagger threshold:
  //   stagger(i) = (i + 1) / (N + 2)
  // A page is "visible/readable" once its stagger-threshold is passed and it's mostly flipped.
  let current = -1;
  for (let i = 0; i < N_PAGES; i++) {
    const stagger = (i + 1) / (N_PAGES + 2);
    const denom = 1 - stagger;
    const po = denom > 0 ? Math.max(0, Math.min(1, (openness - stagger) / denom)) : 0;
    if (po > 0.55) current = i; // most-recent page that's > halfway flipped
  }
  if (current !== lastStep) {
    lastStep = current;
    if (current < 0) {
      stepReadout.classList.remove('visible');
    } else {
      stepNum.textContent = STEPS[current].n;
      stepTitle.textContent = STEPS[current].title;
      stepReadout.classList.add('visible');
    }
  }
}

// ────────── Animation ────────────────────────────────────────────
const clock = new THREE.Clock();
let t = 0;
const PERIOD = 26.0;
const OPEN_FRAC = 0.40;
const HOLD_FRAC = 0.30;
const CLOSE_FRAC = 0.30;
function smoothstep(x) { return x * x * (3 - 2 * x); }

let visible = true;
document.addEventListener('visibilitychange', () => { visible = !document.hidden; });

function animate() {
  requestAnimationFrame(animate);
  if (!visible) return;
  const dt = Math.min(clock.getDelta(), 0.05);
  if (!paused) t += dt;

  // Auto-loop openness
  if (mode === 'auto') {
    const phase = (t % PERIOD) / PERIOD;
    if (phase < OPEN_FRAC) {
      openTarget = smoothstep(phase / OPEN_FRAC);
    } else if (phase < OPEN_FRAC + HOLD_FRAC) {
      openTarget = 1;
    } else {
      openTarget = 1 - smoothstep((phase - OPEN_FRAC - HOLD_FRAC) / CLOSE_FRAC);
    }
  }
  openness += (openTarget - openness) * Math.min(1, dt * 5);

  userYaw   += (userYawT   - userYaw)   * Math.min(1, dt * 6);
  userPitch += (userPitchT - userPitch) * Math.min(1, dt * 6);
  zoom      += (zoomT      - zoom)      * Math.min(1, dt * 6);

  book.rotation.y = 0.20 + Math.sin(t * 0.22) * 0.18 + userYaw;
  book.rotation.x = -0.18 + Math.sin(t * 0.17) * 0.06 + userPitch;
  book.position.y = Math.sin(t * 0.55) * 0.05;

  frontCover.rotation.y = -openness * Math.PI;
  backCover.rotation.y  = openness * 0.06;

  for (let i = 0; i < N_PAGES; i++) {
    const stagger = (i + 1) / (N_PAGES + 2);
    const denom = 1 - stagger;
    const po = denom > 0 ? Math.max(0, Math.min(1, (openness - stagger) / denom)) : 0;
    pages[i].rotation.y = -po * Math.PI;
  }

  camera.position.z = 4.6 / zoom;
  updateReadout();
  renderer.render(scene, camera);
}
animate();
</script>
<script src="../lib/atlas-fx.js"></script>
</body>
</html>
