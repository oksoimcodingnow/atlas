<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Atlas · Skills</title>
<link rel="manifest" href="manifest.json">

<style>

    min-height: 100vh;

  .wrap {
    position: relative; z-index: 1;
    max-width: 1200px;
    margin: 0 auto;
    padding: 44px 28px 80px;
  }

    display: flex;
    justify-content: space-between;
    align-items: flex-end;
    margin-bottom: 28px;
    flex-wrap: wrap;
    gap: 14px;
  }
  .brand .title {
    font-size: 44px;
    font-weight: 800;
    letter-spacing: -0.02em;
    line-height: 1;
    background: linear-gradient(95deg, #818cf8 0%, #22d3ee 60%, #a78bfa 100%);
    -webkit-background-clip: text; background-clip: text;
    -webkit-text-fill-color: transparent;

  .brand .subtitle {
    font-size: 13px; color: var(--muted); margin-top: 8px; letter-spacing: 0.03em;
  }
  .back-link {

    padding: 7px 12px; border: 1px solid var(--border); border-radius: 8px;
    transition: all 0.14s;
  }
  .back-link:hover { color: var(--text); border-color: var(--border-hi); background: rgba(129,140,248,0.1); }
  #search-bar {
    position: sticky; top: 0; z-index: 5;
    background: linear-gradient(180deg, rgba(10,10,20,0.95), rgba(10,10,20,0.85));
    backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
    padding: 14px 0;
    margin: 0 0 8px;
    display: flex; gap: 10px; align-items: center; flex-wrap: wrap;
  }
  #search {
    flex: 1; min-width: 260px;
    background: rgba(15,15,30,0.85);
    border: 1px solid var(--border);
    color: var(--text); padding: 10px 14px; border-radius: 9px;
    font-size: 14px; outline: none;
    transition: border-color 0.18s, box-shadow 0.18s;
  }
  #search::placeholder { color: #5a5a78; }
  #search:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(129,140,248,0.16); }
  .cat-jump {
    display: flex; gap: 6px; flex-wrap: wrap;
  }
  .cat-jump a {
    font-size: 11px; color: var(--muted); text-decoration: none;
    padding: 5px 10px; border: 1px solid var(--border); border-radius: 999px;
    transition: all 0.14s; white-space: nowrap;
  }
  .cat-jump a:hover { color: var(--text); border-color: var(--border-hi); background: rgba(129,140,248,0.12); }
  .category {
    margin-top: 36px;
  }
  .category-header {
    font-size: 13px; font-weight: 700; letter-spacing: 0.18em;
    text-transform: uppercase; color: var(--muted);
    margin-bottom: 16px;
    display: flex; align-items: center; gap: 12px;
  }
  .category-header::after {
    content: ''; flex: 1; height: 1px;
    background: linear-gradient(90deg, rgba(129,140,248,0.22), transparent);
  }
  .category-count {
    color: #6a6a88; font-size: 11px; font-weight: 600;
  }
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(330px, 1fr));
    gap: 14px;
  }
  .skill {
    position: relative;
    background: var(--panel);
    backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 18px 20px 16px;
    overflow: hidden;
    transition: transform 0.18s, border-color 0.18s, box-shadow 0.18s;
  }
  .skill::before {
    content: ''; position: absolute; inset: 0 0 auto 0; height: 2px;
    background: linear-gradient(90deg, var(--cat-color, var(--accent)), transparent);
    opacity: 0.8;
  }
  .skill:hover {
    transform: translateY(-2px);
    border-color: var(--border-hi);
    box-shadow: 0 10px 28px rgba(0,0,0,0.4);
  }
  .skill-name {
    font-size: 14px; font-weight: 700; letter-spacing: 0.01em;
    margin-bottom: 6px; color: var(--text);
    font-family: 'SF Mono', 'Consolas', monospace;
  }
  .skill-purpose {
    font-size: 12.5px; color: #b4b4c8; line-height: 1.5;
    margin-bottom: 12px;
  }
  .try-label {
    font-size: 10px; font-weight: 600; letter-spacing: 0.14em;
    text-transform: uppercase; color: var(--accent);
    margin-bottom: 7px;
  }
  .prompt {
    display: block;
    background: rgba(255,255,255,0.025);
    border: 1px solid rgba(255,255,255,0.05);
    border-radius: 6px;
    padding: 7px 10px;
    margin-bottom: 5px;
    font-size: 12px;
    color: #c8c8d8;
    cursor: pointer;
    transition: all 0.14s;
    line-height: 1.45;
    position: relative;
  }
  .prompt:hover {
    background: rgba(129,140,248,0.14);
    border-color: rgba(129,140,248,0.25);
    color: #fff;
  }
  .prompt.copied {
    background: rgba(52,211,153,0.18);
    border-color: rgba(52,211,153,0.4);
    color: #34d399;
  }
  .prompt.copied::after {
    content: ' ✓ copied'; font-size: 10px; color: #34d399; font-weight: 600;

  .empty-state {
    text-align: center; padding: 60px 20px;
    color: var(--muted); font-size: 14px;

  footer {
    margin-top: 56px;
    text-align: center;
    color: #4a4a66;
    font-size: 11px;
    letter-spacing: 0.08em;
  }
  @media (max-width: 600px) {
    .wrap { padding: 28px 16px 60px; }
    .brand .title { font-size: 32px; }
  }
</style>
</head>

    prompts: [
      'Reduce permission prompts in this project',
      'Allowlist common safe commands from my history',
      'Stop interrupting me about read-only ls/cat commands',
    ]
  },

  // ────── Automation ──────
  { cat: 'automation', name: 'loop',
    purpose: 'Run a prompt or slash command on a recurring interval (e.g. /loop 5m /foo). Omit the interval to let Claude self-pace.',
    prompts: [
      '/loop 5m check the deploy status',
      '/loop /babysit-prs',
      'Loop /code-review every hour until tests pass',
    ]
  },
  { cat: 'automation', name: 'schedule',
    purpose: 'Create / manage scheduled remote agents that run on a cron schedule. Also for one-time future runs.',
    prompts: [
      'Run /babysit-prs every weekday at 9am',
      'Schedule a daily project status report',
      'Remind me to check CI tomorrow at 3pm',
    ]
  },

  // ────── Specialized Tools ──────
  { cat: 'specialized', name: 'graphify',
    purpose: 'Turn any input (code, docs, papers, images) into a clustered knowledge graph — HTML + JSON + audit report.',
    prompts: [
      '/graphify',
      'Build a knowledge graph of this codebase',
      'Generate the architecture map and audit report',
    ]
  },
  { cat: 'specialized', name: 'claude-api',
    purpose: 'Build / debug / optimize Anthropic SDK apps. Adds prompt caching; handles model-version migrations (4.5→4.6→4.7).',
    prompts: [
      'Add prompt caching to my Claude API code',
      'Migrate this Anthropic SDK code from Claude 4.6 to 4.7',
      'Debug my Claude API tool-use loop',
    ]
  },
];

function esc(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

const catMap = {}; CATEGORIES.forEach(c => catMap[c.id] = c);

// Build category jump nav
const jumpEl = document.getElementById('cat-jump');
CATEGORIES.forEach(c => {
  const a = document.createElement('a');
  a.href = '#' + c.id;
  a.textContent = c.name;
  a.style.borderColor = c.color + '55';
  jumpEl.appendChild(a);
});

// Group skills by category
const root = document.getElementById('skills-root');
CATEGORIES.forEach(c => {
  const skillsInCat = SKILLS.filter(s => s.cat === c.id);
  if (!skillsInCat.length) return;
  const section = document.createElement('section');
  section.className = 'category';
  section.id = c.id;
  section.innerHTML = `
    <div class="category-header">
      <span style="color:${c.color}">${esc(c.name)}</span>
      <span class="category-count">${skillsInCat.length} skill${skillsInCat.length===1?'':'s'}</span>
    </div>
    <div class="grid"></div>
  `;
  const grid = section.querySelector('.grid');
  skillsInCat.forEach(s => {
    const card = document.createElement('div');
    card.className = 'skill';
    card.dataset.name = s.name;
    card.dataset.search = (s.name + ' ' + s.purpose + ' ' + s.prompts.join(' ')).toLowerCase();
    card.style.setProperty('--cat-color', c.color);
    card.innerHTML = `
      <div class="skill-name">${esc(s.name)}</div>
      <div class="skill-purpose">${esc(s.purpose)}</div>
      <div class="try-label">Try saying</div>
      ${s.prompts.map(p => `<div class="prompt" data-prompt="${esc(p)}">${esc(p)}</div>`).join('')}
    `;
    grid.appendChild(card);
  });
  root.appendChild(section);
});

// Click-to-copy on prompts
document.addEventListener('click', e => {
  const p = e.target.closest('.prompt');
  if (!p) return;
  const text = p.dataset.prompt;
  navigator.clipboard.writeText(text).then(() => {
    p.classList.add('copied');
    setTimeout(() => p.classList.remove('copied'), 1200);
  }).catch(() => {});
});

// Search filter
const searchEl = document.getElementById('search');
searchEl.addEventListener('input', () => {
  const q = searchEl.value.toLowerCase().trim();
  let anyVisible = false;
  document.querySelectorAll('.skill').forEach(card => {
    const match = !q || card.dataset.search.includes(q);
    card.classList.toggle('hidden', !match);
    if (match) anyVisible = true;
  });
  // Hide empty category sections
  document.querySelectorAll('.category').forEach(sec => {
    const hasVisible = sec.querySelector('.skill:not(.hidden)');
    sec.style.display = hasVisible ? '' : 'none';
  });
});
</script>
</body>
</html>
