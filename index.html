<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg:#0a0a14; --bg-2:#11112a; --panel:#0b0b16;
    --text:#f1efe6; --muted:#9a9ab8; --faint:#6b6b78;
    --rule:rgba(241,239,230,0.14); --rule-hi:rgba(184,192,255,0.45);
    --accent:#b8c0ff; --gold:#f3d59a; --green:#5fd39a; --pink:#ff8db3;
    --gutter:clamp(18px,4.5vw,44px);
    --serif:'Cormorant Garamond','Iowan Old Style',Georgia,serif;
    --sans:'Inter Tight',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
    --mono:'JetBrains Mono',Consolas,monospace;
  }
  html, body { height: 100%; background: var(--bg); color: var(--text); }
  body {
    font-family: var(--sans); font-size: 15px; line-height: 1.55;
    -webkit-font-smoothing: antialiased; min-height: 100vh; overflow-x: hidden;
  }
  a { color: inherit; text-decoration: none; }
  ::selection { background: var(--accent); color: var(--bg); }
  ::-webkit-scrollbar { width: 7px; } ::-webkit-scrollbar-thumb { background: rgba(184,192,255,0.25); }
  /* warm glow above the constellation canvas (z-index 0, injected by atlas-fx) */
  body::after { content:''; position:fixed; inset:0; z-index:0; pointer-events:none;
    background: radial-gradient(720px 400px at 68% -10%, rgba(184,192,255,0.10), transparent 65%); }
  /* quiet the starfield behind reading text — full brightness fought the copy */
  body #bg-canvas { opacity: 0.4; }

  .wrap { position: relative; z-index: 2; max-width: 1060px; margin: 0 auto;
    padding: 0 var(--gutter) 72px; }

  /* ── header: tiny brand + clock ── */
  header {
    display: flex; justify-content: space-between; align-items: center; gap: 16px;
    padding: 20px 0 16px; border-bottom: 1px solid var(--rule); margin-bottom: clamp(34px,6vw,58px);
  }
  .brand { font-family: var(--serif); font-style: italic; font-size: 19px; letter-spacing: 0.01em; }
  .brand b { font-weight: 600; color: var(--accent); }
  .meta { text-align: right; line-height: 1.45; }
  .meta #clock { font-family: var(--mono); font-size: 21px; font-weight: 500;
    font-variant-numeric: tabular-nums; letter-spacing: 0.03em; }
  .meta #date { font-size: 11px; color: var(--faint); }

  /* ── hero ── */
  .hero { max-width: 760px; animation: atlasEntry 0.65s cubic-bezier(0.2,0.7,0.2,1) both; }
  .eyebrow { font-size: 11px; letter-spacing: 0.26em; text-transform: uppercase;
    color: var(--gold); font-weight: 700; display: inline-flex; align-items: center; gap: 12px;
    margin-bottom: 18px; }
  .eyebrow::before { content:''; width: 28px; height: 1px; background: var(--gold); }
  h1 { font-family: var(--serif); font-weight: 500; font-size: clamp(42px,8.5vw,88px);
    line-height: 0.96; letter-spacing: -0.02em; text-wrap: balance; }
  h1 em { font-style: italic; color: var(--accent); }
  .lede { font-family: var(--serif); font-size: clamp(18px,2.3vw,24px); line-height: 1.45;
    color: var(--muted); margin-top: 16px; max-width: 540px; }
  .lede b { color: var(--text); font-weight: 600; }
  @media (prefers-reduced-motion: reduce) { .hero { animation: none; } }

  /* ── featured rows (the flagships) ── */
  .featured { display: flex; flex-direction: column; gap: 13px; margin-top: clamp(36px,6vw,54px); }
  .tile.feat {
    display: grid; grid-template-columns: 52px 1fr; gap: 6px 18px; align-items: start;
    background: var(--panel); border: 1px solid var(--rule); border-radius: 16px;
    padding: 22px 24px 20px; transition: border-color .2s, background .2s;
  }
  .tile.feat:hover { border-color: var(--rule-hi); background: #0e0e1f; }
  .feat-glyph { font-family: var(--serif); font-size: 34px; line-height: 1;
    color: var(--tile-color, var(--accent)); padding-top: 5px; text-align: center; }
  .feat-name { font-family: var(--serif); font-weight: 500;
    font-size: clamp(23px,3.2vw,30px); line-height: 1.08; }
  .feat-desc { font-size: 13.5px; color: var(--muted); line-height: 1.6;
    max-width: 64ch; margin-top: 5px; }
  .feat-actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 13px; }
  .lnk { font-size: 12px; font-weight: 600; color: var(--muted);
    padding: 7px 14px; border: 1px solid var(--rule); border-radius: 999px;
    transition: color .15s, border-color .15s, background .15s; }
  .lnk:hover { color: var(--text); border-color: var(--rule-hi); background: rgba(184,192,255,0.08); }
  .lnk.primary { color: var(--bg); background: var(--accent); border-color: var(--accent); }
  .lnk.primary:hover { background: #cdd3ff; border-color: #cdd3ff; }

  /* ── the index (everything else, one quiet row each) ── */
  .section-header { display: flex; align-items: baseline; gap: 14px;
    margin: clamp(36px,6vw,52px) 0 14px; }
  .section-header span { font-family: var(--serif); font-style: italic; font-weight: 500;
    font-size: 24px; color: var(--text); }
  .section-header::after { content:''; flex: 1; height: 1px; background: var(--rule);
    transform: translateY(-6px); }
  .section-header .count { font-family: var(--mono); font-size: 11px; color: var(--faint); }

  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(310px,1fr)); gap: 10px; }
  .tile.row { border: 1px solid var(--rule); border-radius: 12px; background: var(--panel);
    transition: border-color .18s, background .18s; }
  .tile.row:hover { border-color: var(--rule-hi); background: var(--bg-2); }
  .row-main { display: flex; align-items: center; gap: 13px; padding: 13px 15px; min-height: 56px; }
  .row-glyph { font-family: var(--serif); font-size: 19px; width: 24px; flex: none;
    text-align: center; color: var(--tile-color, var(--accent)); }
  .row-body { flex: 1; min-width: 0; }
  .row-name { display: flex; align-items: center; gap: 7px; font-size: 14.5px; font-weight: 600; }
  .row-desc { font-size: 12px; color: var(--muted); line-height: 1.45; margin-top: 1px;
    overflow: hidden; display: -webkit-box; -webkit-line-clamp: 1; -webkit-box-orient: vertical; }
  .row-go { color: var(--faint); font-size: 14px; flex: none; transition: color .15s, transform .15s; }
  .tile.row:hover .row-go { color: var(--accent); transform: translateX(2px); }
  .row-extra { display: flex; flex-wrap: wrap; gap: 4px 14px;
    padding: 0 15px 11px 52px; margin-top: -4px; }
  .row-extra a { font-family: var(--mono); font-size: 11px; color: var(--muted); }
  .row-extra a:hover { color: var(--accent); }
  .pill { font-size: 9.5px; letter-spacing: 0.12em; text-transform: uppercase; font-weight: 700;
    padding: 2px 7px; border-radius: 999px; border: 1px solid var(--rule); color: var(--muted); flex: none; }
  .pill.planned { color: var(--gold); border-color: rgba(243,213,154,0.4); }
  .pill.local { color: var(--green); border-color: rgba(95,211,154,0.4); }

  .tile.add { display: flex; align-items: center; justify-content: center; min-height: 56px;
    border: 1px dashed var(--rule); border-radius: 12px; color: var(--faint);
    font-family: var(--mono); font-size: 11.5px; letter-spacing: 0.08em; cursor: pointer;
    transition: color .15s, border-color .15s; }
  .tile.add:hover { color: var(--accent); border-color: var(--rule-hi); }

  footer { margin-top: clamp(48px,8vw,72px); padding-top: 22px; border-top: 1px solid var(--rule);

  footer .path:hover { color: var(--accent); }

  @media (max-width: 600px) {
    header { padding-top: 16px; }
    .meta #clock { font-size: 18px; }
    .tile.feat { grid-template-columns: 36px 1fr; padding: 18px 16px 16px; }
    .feat-glyph { font-size: 24px; }
    .row-extra { padding-left: 16px; }
  }
</style>

function esc(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function slug(name) {
  return name.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '');
}
function linkAttrs(href) {
  return href && href.startsWith('http') ? ' target="_blank" rel="noopener"' : '';
}
// Status pill only when it says something ("live" on everything is noise).
function pillHtml(status) {
  return status === 'live' ? '' : '<span class="pill ' + esc(status) + '">' + esc(status) + '</span>';
}

// Flagship row: serif name, full description, every action as a pill link.
function makeFeature(p, delay) {
  const tile = document.createElement('div');
  tile.className = 'tile feat';
  tile.dataset.tour = slug(p.name);
  tile.style.setProperty('--tile-color', p.color);
  tile.style.animationDelay = delay.toFixed(2) + 's';
  const actions = p.actions.map(a =>
    '<a class="lnk' + (a.primary ? ' primary' : '') + '" href="' + esc(a.href) + '"' + linkAttrs(a.href) + '>' + esc(a.label) + '</a>'
  ).join('');
  tile.innerHTML =
    '<div class="feat-glyph">' + esc(p.icon) + '</div>' +
    '<div>' +
      '<h3 class="feat-name">' + esc(p.name) + ' ' + pillHtml(p.status) + '</h3>' +
      '<p class="feat-desc">' + esc(p.desc) + '</p>' +
      '<div class="feat-actions">' + actions + '</div>' +
    '</div>';
  return tile;
}

// Index row: one quiet line per project. The row opens the primary action;
// extra actions get a small mono link line underneath.
function makeRow(p, delay) {
  const tile = document.createElement('div');
  tile.className = 'tile row';
  tile.dataset.tour = slug(p.name);
  tile.style.setProperty('--tile-color', p.color);
  tile.style.animationDelay = delay.toFixed(2) + 's';
  const primary = p.actions.find(a => a.primary) || p.actions[0];
  const extras = p.actions.filter(a => a !== primary);
  let html =
    '<a class="row-main" href="' + esc(primary.href) + '"' + linkAttrs(primary.href) + '>' +
      '<span class="row-glyph">' + esc(p.icon) + '</span>' +
      '<span class="row-body">' +
        '<span class="row-name">' + esc(p.name) + ' ' + pillHtml(p.status) + '</span>' +
        '<span class="row-desc">' + esc(p.desc) + '</span>' +
      '</span>' +
      '<span class="row-go">→</span>' +
    '</a>';
  if (extras.length) {
    html += '<div class="row-extra">' + extras.map(a =>
      '<a href="' + esc(a.href) + '"' + linkAttrs(a.href) + '>' + esc(a.label) + '</a>'
    ).join('') + '</div>';
  }
  tile.innerHTML = html;
  return tile;
}

  if (!grouped[p.section]) { grouped[p.section] = []; order.push(p.section); }
  grouped[p.section].push(p);
});

  const header = document.createElement('div');
  header.className = 'section-header';
  header.style.animationDelay = Math.min(delay, 0.7).toFixed(2) + 's';
  header.innerHTML = '<span>' + esc(name) + '</span><span class="count">' + grouped[name].length + '</span>';
  sectionsEl.appendChild(header);
  delay += 0.05;

  const grid = document.createElement('div');
  grid.className = 'grid';
  grouped[name].forEach(p => {
    grid.appendChild(makeRow(p, Math.min(delay, 0.85)));
    delay += 0.03;
  });
  if (name === 'Projects') {
    const addTile = document.createElement('div');
    addTile.className = 'tile add';
    addTile.style.animationDelay = Math.min(delay, 0.85).toFixed(2) + 's';
    addTile.textContent = '+ add project';
    addTile.title = 'Edit index.html and add to the ITEMS array';
    grid.appendChild(addTile);
  }
  sectionsEl.appendChild(grid);
});

// ── clock ──
function tick() {
  const now = new Date();
  const hh = String(now.getHours()).padStart(2, '0');
  const mm = String(now.getMinutes()).padStart(2, '0');
  document.getElementById('clock').textContent = `${hh}:${mm}`;
  document.getElementById('date').textContent = now.toLocaleDateString(undefined, { weekday: 'long', month: 'short', day: 'numeric' });
}
tick();
setInterval(tick, 30000);

// Click the footer path to copy it (so you can always find the real Atlas folder)
(function(){
  var el = document.getElementById('atlasPath');
  if (!el) return;
  el.addEventListener('click', function(){
    var path = 'C:\\Users\\HOME\\atlas';
    var done = function(){
      var c = document.getElementById('pathCopied');
      if (!c) return; c.style.opacity = '1';
      setTimeout(function(){ c.style.opacity = '0'; }, 1500);
    };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(path).then(done).catch(done);
    } else {
      var t = document.createElement('textarea'); t.value = path;
      document.body.appendChild(t); t.select();
      try { document.execCommand('copy'); } catch(e){}
      document.body.removeChild(t); done();
    }
  });
})();
